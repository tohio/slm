name: slm-mini
wandb_project: slm-mini

model:
  vocab_size: 32000
  hidden_size: 512
  intermediate_size: 1536
  num_hidden_layers: 17
  num_attention_heads: 8
  num_key_value_heads: 4
  max_position_embeddings: 2048
  rope_theta: 500000.0           # pre-stretched base (consistent across all sizes)
  rms_norm_eps: 1.0e-5
  initializer_range: 0.02
  tie_word_embeddings: true

data:
  val_fraction: 0.005

training:
  # Runtime replaces these planning values using the realized tokenized
  # training corpus and the one-epoch mini contract.
  schedule_from_realized_tokens: true
  # Planning basis: 1.4B tokens × 1 epoch, global batch 32, context 2,048.
  max_steps: 21363
  warmup_steps: 214
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  precision: bf16
  gradient_clip_val: 1.0
  gradient_checkpointing: false
  torch_compile: true
  eval_steps: 500
  save_steps: 500
  save_total_limit: 3
  log_steps: 10
  num_workers: 4
  seed: 42
  lr_scheduler: cosine
  report_to:
    - wandb

optimizer:
  lr: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
