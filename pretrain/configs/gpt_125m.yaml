name: slm-125m
wandb_project: slm

model:
  vocab_size: 32000
  hidden_size: 768
  num_hidden_layers: 16
  num_attention_heads: 12
  num_key_value_heads: 4
  max_position_embeddings: 2048
  rope_theta: 500000.0           # pre-stretched base (consistent across all sizes)
  rms_norm_eps: 1.0e-5
  initializer_range: 0.02
  tie_word_embeddings: true

data:
  val_fraction: 0.005

training:
  # Same-size uses its realized corpus. Cross-size uses this model's bounded prefix.
  cross_size_max_train_tokens: 10000001024
  # Runtime replaces the planning max/warmup steps below using verified
  # tokenized train tokens while preserving the configured warmup ratio.
  schedule_from_realized_tokens: true
  # ── Batch size ──────────────────────────────────────────────────────────────
  # Global batch = micro_batch_size × gradient_accumulation_steps × num_gpus
  # These values assume 1 GPU. Adjust before running multi-GPU training:
  #   divide gradient_accumulation_steps by num_gpus to hold global batch constant
  #   keep max_steps unchanged when global batch is held constant
  #
  # Planning basis: 10B curation target × 2 epochs = 20B consumed tokens
  # Tokens/step (1 GPU): 4 × 8 × 1 × 2048 = ~65k tokens/step
  # 1 epoch  → ~152,587 steps
  # 2 epochs → ~305,175 steps
  #
  # 1 GPU:  grad_accum=8, max_steps=305175
  # 4 GPU:  grad_accum=2, max_steps=305175
  # 8 GPU:  grad_accum=1, max_steps=305175
  max_steps: 305175
  warmup_steps: 3051
  micro_batch_size: 4
  gradient_accumulation_steps: 8   # 1 GPU default — see scaling note above
  precision: bf16
  attn_implementation: flash_attention_3
  torch_compile: true
  torch_compile_mode: max-autotune-no-cudagraphs
  fused_linear_cross_entropy: true
  gradient_clip_val: 1.0
  gradient_checkpointing: false
  eval_steps: 500
  save_steps: 500
  save_total_limit: 3
  log_steps: 10
  num_workers: 4
  seed: 42
  lr_scheduler: cosine
  report_to:
    - wandb

generation_probes:
  enabled: true
  every_steps: 5000
  steps: []
  at_final: true
  do_sample: false
  max_new_tokens: 64

final_evaluation:
  prefix_count: 5

optimizer:
  lr: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
