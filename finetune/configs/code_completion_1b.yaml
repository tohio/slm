model:
  base_model_path: $RESULTS_DIR/runs/1b/sft_code/final
  output_dir: $RESULTS_DIR/runs/1b/sft_code_completion

data:
  train_path: $DATA_DIR/runs/1b/code_completion/train.jsonl
  val_path: $DATA_DIR/runs/1b/code_completion/val.jsonl
  max_length: 768

training:
  micro_batch_size: 2
  eval_micro_batch_size: 2
  gradient_accumulation_steps: 16
  max_updates: 1000
  learning_rate: 5.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.05
  eval_steps: 100
  save_steps: 100
  save_best: true
  seed: 42
