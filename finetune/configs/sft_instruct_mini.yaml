name: slm-mini-instruct
wandb_project: slm-mini
model:
  base_model_path: $RESULTS_DIR/runs/mini/pretrain/final
  max_seq_length: 1024
data:
  train_path: $DATA_DIR/runs/mini/sft_instruct/train.jsonl
  val_path: $DATA_DIR/runs/mini/sft_instruct/val.jsonl
  packing: false
  max_samples: 500
training:
  max_steps: 50
  warmup_ratio_recipe: 0.03
  micro_batch_size: 2
  gradient_accumulation_steps: 2
  precision: bf16
  gradient_clip_val: 1.0
  gradient_checkpointing: false
  eval_steps: 25
  save_steps: 50
  save_total_limit: 1
  log_steps: 5
  num_workers: 2
  seed: 42
  lr_scheduler: cosine
  report_to:
  - wandb
optimizer:
  lr: 1.0e-05
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.98
