[pytest]
markers =
    stage(name): marks tests that require a pipeline stage output
    slow: bounded tests intentionally excluded from the fast CPU gate
    gpu: tests that require a CUDA device
pythonpath = .
testpaths = tests
filterwarnings =
    ignore:hf_xet\.download_files\(\) is deprecated.*:DeprecationWarning
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
