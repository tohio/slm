name: slm
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pip
  - pip:
    # Keep conda and venv installs on the same dependency source of truth.
    # NVIDIA GPU instances should use infra/setup_gpu_instance.sh instead;
    # that script installs requirements-gpu.txt and verifies CUDA/driver/SM.
    - -r requirements.txt
