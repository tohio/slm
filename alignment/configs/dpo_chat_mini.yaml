name: slm-mini-chat
wandb_project: slm-mini
model:
  base_model_path: $RESULTS_DIR/runs/mini/sft_instruct/final
  max_seq_length: 1024
dpo:
  beta: 0.1
  loss_type: sigmoid
  label_smoothing: 0.0
  f_divergence_type: reverse_kl
  disable_dropout: true
  precompute_ref_log_probs: true
data:
  train_path: $DATA_DIR/runs/mini/dpo_chat/train.jsonl
  val_path: $DATA_DIR/runs/mini/dpo_chat/val.jsonl
  min_retention_ratio: 0.99
training:
  max_steps: 50
  warmup_ratio_recipe: 0.05
  micro_batch_size: 1
  eval_micro_batch_size: 1
  gradient_accumulation_steps: 2
  precision: bf16
  gradient_clip_val: 1.0
  gradient_checkpointing: false
  torch_compile: false
  eval_steps: 25
  save_steps: 25
  save_total_limit: 1
  log_steps: 5
  num_workers: 2
  seed: 42
  lr_scheduler: cosine
  report_to:
  - wandb
optimizer:
  lr: 5.0e-07
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.98
